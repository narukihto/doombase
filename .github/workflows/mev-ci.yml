
name: MEV Simulation Suite

on:
  push:
    branches: [ main ]
  workflow_dispatch: # يتيح لك تشغيل البوت يدوياً في أي وقت بضغطة زر واحدة

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    # تحديد أقصى حد للتشغيل المجاني المستمر على جيت هاب (360 دقيقة = 6 ساعات كاملة)
    timeout-minutes: 360 

    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4

    # تصحيح بيئة العمل لتعمل فوراً في خوادم جيت هاب
    - name: Set up Rust Environment
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable

    - name: Set up Foundry Toolchain
      uses: foundry-rs/foundry-toolchain@v1

    # 1. عمل فورك حقيقي وتنافسي لشبكة Base Mainnet عبر رادارات Alchemy الواردة منك مجاناً
    - name: Initialize Base Mainnet Network Local Fork
      run: |
        # تشغيل Anvil في الخلفية لإنشاء بلوكشين محلي يطابق شبكة Base تماماً
        anvil --fork-url ${{ secrets.ALCHEMY_BASE_RPC_URL }} --port 8545 &
        # الانتظار لثوانٍ معدودة للتأكد من تشغيل بيئة Anvil واستقرارها تماماً
        sleep 5

    # 2. خطوة فحص عقد المراجحة والاقتراض الحتمي من Aave V3 لضمان نجاح الـ Callback
    - name: Run Aave Flash Loan Contract Forking Simulation
      env:
        ALCHEMY_BASE_URL: ${{ secrets.ALCHEMY_BASE_RPC_URL }}
      run: |
        cd contracts
        # اختبار العقد مباشرة للتأكد من ربط منطق الاقتراض الديناميكي والـ Loops بنجاح
        forge test --fork-url $ALCHEMY_BASE_URL -vvv

    # 3. تشغيل جناح الفحص القاسي للتأكد من سرعة التوازي ومقاومة الضوضاء السعرية في البوت
    - name: Run Strict Performance Tests (Strict Tests)
      run: |
        cd bot
        cargo test --release --test strict_tests

    # 4. بناء وترجمة البوت المدمج والعقد الذكي بأعلى مستويات التحسين البرمجي لسرعة الاكتساح
    - name: Build System Profiles
      run: |
        cd contracts
        forge build
        cd ../bot
        cargo build --release

    # 5. محاكاة نشر العقد وتشغيل البوت لـ 6 ساعات متواصلة لمراقبة السرعة والأوامر الذرية
    - name: Deploy Virtual Contract & Execute 6-Hour Predictive MEV Bot
      run: |
        # تعيين عنوان عقد افتراضي تم نشره داخل محاكاة Anvil
        echo "CONTRACT_ADDRESS=0x5FbDB2315678afecb367f032d93F642f64180aa3" >> $GITHUB_ENV
        
        cd bot
        echo "🚀 Launching 6-Hour Live Streaming Simulation via Alchemy WSS..."
        # تشغيل البوت المدمج وتركه يقتنص الصفقات الميكروثانية لـ 6 ساعات كاملة
        cargo run --release
      env:
        ALCHEMY_BASE_RPC_URL: ${{ secrets.ALCHEMY_BASE_RPC_URL }}
        CONTRACT_ADDR: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
