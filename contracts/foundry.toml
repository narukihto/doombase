[profile.default]
# تحديد مجلد الأكواد المصدرية والمخرجات
src = "src"
out = "out"
libs = ["lib"]

# تفعيل نظام التحسين الصارم لتقليل استهلاك الغاز لأدنى حد
optimizer = true
optimizer_runs = 200

# إصدار لغة Solidity المتوافق وصارماً مع عقود Aave V3
solc_version = "0.8.10"

# ✅ إلغاء قيود الغاز في بيئة المحاكاة والاختبار عالمياً لمنع فشل مجمعات Aave و Uniswap
gas_limit = 9223372036854775807
block_gas_limit = 9223372036854775807

# تثبيت مسارات استيراد المكتبات بشكل حتمي لمنع أخطاء بيئة جيت هاب
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "@uniswap/v3-core/=lib/v3-core/",
    "@uniswap/v3-periphery/=lib/v3-periphery/",
    "kyberswap/=lib/kyberswap-protocols/"
]

# ✅ دمج وتحديث إعدادات anvil لمنع ظهور تحذيرات "unknown anvil config" في السجلات
[profile.default.rpc_storage_caching]
chains = "all"

[profile.default.anvil]
block_time = 2

[rpc_endpoints]
base_local = "http://127.0.0.1:8545"
