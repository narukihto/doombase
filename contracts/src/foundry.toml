[profile.default]
# تحديد مجلد الأكواد المصدرية والمخرجات
src = "src"
out = "out"
libs = ["lib"]

# تفعيل نظام التحسين الصارم لتقليل استهلاك الغاز لأدنى حد (زطي)
optimizer = true
optimizer_runs = 200

# إصدار لغة Solidity المتوافق مع العقد وشبكة Base
solc_version = "0.8.20"

# إعدادات بيئة المحاكاة المحلية (Anvil) لضمان مطابقة وقت البلوك لشبكة Base
block_time = 2

[rpc_endpoints]
# نقطة الاتصال الافتراضية التي سنستخدمها في محاكاة جيت هاب
base_local = "http://127.0.0.1:8545"
